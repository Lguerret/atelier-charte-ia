services:
  - type: web
    name: atelier-charte-ia
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: RETENTION_DAYS
        value: "30"
