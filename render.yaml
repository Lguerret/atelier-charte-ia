services:
  - type: web
    name: atelier-charte-ia
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: RETENTION_DAYS
        value: "30"
      # Base PostgreSQL : les sessions survivent aux mises en veille et redémarrages du serveur
      - key: DATABASE_URL
        fromDatabase:
          name: atelier-charte-ia-db
          property: connectionString

databases:
  # Offre gratuite Render : 1 Go, expire 30 jours après sa création (passage en offre payante possible)
  - name: atelier-charte-ia-db
    plan: free
    region: frankfurt
    databaseName: atelier
    user: atelier
